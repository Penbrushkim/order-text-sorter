<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>주문 텍스트 정렬기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Work+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Design: CafeBlend(따뜻한 커피톤·뉴모피즘) + Solutions(접근성: 16px 본문, 40px 터치 영역, 뚜렷한 포커스, 넉넉한 여백) */
:root {
  --bg: #FDF6EC;            /* 페이지 배경 (따뜻한 크림) */
  --surface: #FFFFFF;       /* 카드 */
  --inset: #F0E6D6;         /* 입력창 */
  --inset-hover: #EBE0D0;
  --ink: #3E2723;
  --muted: #7A6558;
  --line: #E8DDD0;
  --accent: #8B5E3C;
  --accent-hover: #6B4226;
  --accent-ink: #FFFFFF;
  --accent-soft: #FAF0E1;
  --tag: #C4956A;
  --ok: #047857;
  --focus: rgba(139, 94, 60, .28);
  --raised: 6px 6px 12px #D5C9B8, -6px -6px 12px #FFFFFF;
  --raised-mini: 2px 2px 4px #D5C9B8, -2px -2px 4px #FFFFFF;
  --inset-sh: inset 4px 4px 8px #D5C9B8, inset -4px -4px 8px #FFFFFF;
  --inset-mini: inset 2px 2px 4px #D5C9B8, inset -2px -2px 4px #FFFFFF;
  --font-ui: "Work Sans", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --font-head: "DM Serif Display", "Noto Serif KR", serif;
  --font-mono: "Nanum Gothic Coding", ui-monospace, "SF Mono", Menlo, monospace; /* 한글 2칸 폭 정렬을 위해 유지 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #231A15; --surface: #2E231C; --inset: #1D1612; --inset-hover: #241B16; --ink: #F3E6D8; --muted: #BBA797;
    --line: #45362C; --accent: #D2A679; --accent-hover: #E0B88E; --accent-ink: #2A1D14; --accent-soft: #3A2C22; --tag: #C4956A;
    --ok: #34D399; --focus: rgba(210, 166, 121, .35);
    --raised: 6px 6px 12px #150F0B, -6px -6px 12px #3A2D24;
    --raised-mini: 2px 2px 4px #150F0B, -2px -2px 4px #3A2D24;
    --inset-sh: inset 4px 4px 8px #120D0A, inset -4px -4px 8px #382B22;
    --inset-mini: inset 2px 2px 4px #120D0A, inset -2px -2px 4px #382B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #231A15; --surface: #2E231C; --inset: #1D1612; --inset-hover: #241B16; --ink: #F3E6D8; --muted: #BBA797;
  --line: #45362C; --accent: #D2A679; --accent-hover: #E0B88E; --accent-ink: #2A1D14; --accent-soft: #3A2C22; --tag: #C4956A;
  --ok: #34D399; --focus: rgba(210, 166, 121, .35);
  --raised: 6px 6px 12px #150F0B, -6px -6px 12px #3A2D24;
  --raised-mini: 2px 2px 4px #150F0B, -2px -2px 4px #3A2D24;
  --inset-sh: inset 4px 4px 8px #120D0A, inset -4px -4px 8px #382B22;
  --inset-mini: inset 2px 2px 4px #120D0A, inset -2px -2px 4px #382B22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1 { font-family: var(--font-head); font-size: 34px; line-height: 42px; margin: 0; font-weight: 500; letter-spacing: 0; }
.sub { color: var(--muted); font-size: 14px; line-height: 22px; margin: 4px 0 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.top > div:first-child { min-width: 0; }
.top-r { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.ver { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }

/* 탭: 둥근 알약 + 약한 입체 */
.tabs { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 4px 8px; }
.tab {
  font: inherit; font-weight: 500; font-size: 16px; min-height: 44px; padding: 0 20px; border-radius: 9999px;
  border: 0; background: var(--bg); color: var(--ink); cursor: pointer; box-shadow: var(--raised);
  display: inline-flex; gap: 10px; align-items: center; transition: background .2s ease, box-shadow .2s ease, color .2s ease;
}
.tab:hover { color: var(--accent-hover); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: var(--inset-mini); }
.tab .n { font-size: 13px; min-width: 24px; text-align: center; padding: 1px 8px; border-radius: 9999px; background: var(--accent-soft); color: var(--accent-hover); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .n { background: rgba(255,255,255,.24); color: var(--accent-ink); }

.panel { display: flex; flex-direction: column; gap: 32px; }
.box { background: var(--surface); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: var(--raised); }
.box h2 { font-family: var(--font-head); font-size: 20px; line-height: 28px; margin: 0; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hint { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 13px; line-height: 20px; }

textarea.src {
  width: 100%; min-height: 160px; resize: vertical; font-family: var(--font-mono); font-size: 16px; line-height: 1.6;
  padding: 14px 16px; border-radius: 12px; border: 0; background: var(--inset); color: var(--ink); box-shadow: var(--inset-sh);
}
textarea.src:hover { background: var(--inset-hover); }
textarea.src:focus-visible { outline: 0; box-shadow: var(--inset-sh), 0 0 0 3px var(--focus); }

.btn {
  font: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 20px; border-radius: 12px; cursor: pointer;
  border: 0; background: var(--accent-soft); color: var(--accent-hover); box-shadow: var(--raised-mini);
  transition: background .2s ease, box-shadow .2s ease, color .2s ease;
}
.btn:hover { box-shadow: var(--raised); }
.btn:active { box-shadow: var(--inset-mini); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; min-height: 48px; padding: 0 28px; box-shadow: var(--raised); }
.btn.primary:hover { background: var(--accent-hover); color: var(--accent-ink); }
.btn.primary:active { box-shadow: var(--inset-mini); }
.btn.ok, .btn.primary.ok { background: var(--ok); color: #FFFFFF; }
#themeBtn { background: transparent; box-shadow: none; color: var(--accent-hover); }
#themeBtn:hover { background: var(--accent-soft); box-shadow: none; }

.row-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.note { font-size: 13px; line-height: 20px; color: var(--muted); }
.note:not(:empty) { padding: 6px 12px; border-left: 4px solid var(--tag); background: var(--accent-soft); border-radius: 6px; }
.empty { color: var(--muted); font-size: 14px; line-height: 22px; padding: 16px 4px; }

.opt { display: inline-flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px; cursor: pointer; }
.opt select {
  font: inherit; font-size: 16px; height: 40px; padding: 0 12px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--inset); color: var(--ink); box-shadow: var(--inset-mini);
}

/* 체크박스: 작은 요소라 얕은 그림자만 */
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 6px; flex: 0 0 auto;
  background: var(--inset); box-shadow: var(--inset-mini); cursor: pointer; display: inline-grid; place-content: center;
  transition: background .2s ease;
}
input[type="checkbox"]:checked { background: var(--accent); box-shadow: var(--raised-mini); }
input[type="checkbox"]:checked::after {
  content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: translate(0, -1px) rotate(45deg);
}

.items { display: flex; flex-direction: column; gap: 16px; }
.item { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.item.off { opacity: .5; }
.item > .checks { display: flex; align-items: flex-start; padding-top: 3px; }
.item .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-width: 0; padding-right: 76px; }
.model { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.meta { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.simple { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; min-height: 40px; padding: 0 8px; }
.fields { grid-column: 2; display: flex; gap: 12px; flex-wrap: wrap; }
.fields label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); flex: 1 1 110px; min-width: 0; }
.fields input {
  font: inherit; font-size: 16px; height: 44px; padding: 0 14px; border-radius: 12px; border: 0; width: 100%; min-width: 0;
  background: var(--inset); color: var(--ink); box-shadow: var(--inset-mini); font-variant-numeric: tabular-nums;
}
.fields input:hover { background: var(--inset-hover); }
.fields input:focus-visible { outline: 0; box-shadow: var(--inset-mini), 0 0 0 3px var(--focus); }

pre.out {
  margin: 0; font-family: var(--font-mono); font-size: 15px; line-height: 1.7; white-space: pre; overflow-x: auto;
  background: var(--inset); color: var(--ink); border-radius: 12px; padding: 18px 20px; min-height: 96px; tab-size: 1; box-shadow: var(--inset-sh);
}
.spacer { flex: 1; }
@media (max-width: 576px) {
  body { padding-block: 20px 48px; }
  h1 { font-size: 28px; line-height: 36px; }
  .top { flex-direction: column; gap: 8px; }
  .box { padding: 16px; }
  .panel { gap: 24px; }
  .item { padding: 14px; }
  .fields label { flex-basis: 45%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>주문 텍스트 정렬기</h1>
      <p class="sub">붙여넣은 주문 내용을 전표 형식으로 바꿉니다. 함량별로 창이 나뉘어 있습니다.</p>
    </div>
    <div class="top-r">
      <button class="btn" type="button" id="themeBtn">다크모드</button>
      <span class="ver">V1.5</span>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
(function () {
  var SAMPLES = { K14: "", K18: "", K24: "" };
  var WINDOWS = [
    { id: "K24", label: "K24 (순금)", karat: "K24" },
    { id: "K18", label: "K18", karat: "K18" },
    { id: "K14", label: "K14", karat: "K14" }
  ];
  var VENDORS = { "크라이스": "A67", "레이나": "A45", "예랑": "YR" };
  var GAP = "   ";
  var state = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function cw(s) { var w = 0; for (var i = 0; i < s.length; i++) { w += s.charCodeAt(i) > 0x2e7f ? 2 : 1; } return w; }
  function sp(n) { return n > 0 ? new Array(n + 1).join(" ") : ""; }
  function normSg(s) { return s.replace(/\s*-\s*/, "-"); }
  // 중량(g)을 수정하면 수공-중량의 '중량'을 다시 계산한다: g ÷ 3.75 = 돈 → 소수 둘째 자리 반올림 → 3자리 표기 (2.53g → 0.67돈 → 067, 3.75g → 1돈 → 100)
  function toDon3(g) { return ("00" + Math.round(g / 3.75 * 100)).slice(-Math.max(3, String(Math.round(g / 3.75 * 100)).length)); }
  function applyWeight(it) {
    var g = parseFloat(it.weight);
    if (!it.srcSg || !(g > 0) || it.weight === it.srcWeight) { it.sg = it.srcSg; return; }
    var su = it.srcSg.split("-")[0];
    it.sg = su + "-" + toDon3(g);
  }

  function parseGold(text, karat) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var items = [], skipped = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^K\s?(14|18|24)\s*([\d.]+)\s*g?$/i);
      if (!m || i === 0) continue;
      if ("K" + m[1] !== karat) { skipped++; continue; }
      var sg = lines[i + 1] && /^\d+\s*-\s*\d+$/.test(lines[i + 1]) ? normSg(lines[i + 1]) : "";
      var it = { model: lines[i - 1], sg: sg, weight: m[2], partner: "", price: "" };
      // 4줄 형식: 첫 줄 = 'B7- 디바스B260 | 디바스' → 앞의 영문/숫자 = 거래처(B7), '|' 바로 앞 숫자 = 입고가(260)
      var h = i >= 2 ? lines[i - 2] : "";
      if (h && !/^K\s?(14|18|24)\s*[\d.]+\s*g?$/i.test(h) && !/^\d+\s*-\s*\d+$/.test(h)) {
        var pm = h.match(/^[A-Z0-9]+/);
        if (pm) it.partner = pm[0];
        var bar = h.indexOf("|");
        if (bar >= 0) { var pr = h.slice(0, bar).match(/(\d+(?:\.\d+)?)\s*$/); if (pr) it.price = pr[1]; }
      }
      items.push(it);
    }
    return { items: items, skipped: skipped };
  }

  function parsePure(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var items = [];
    for (var i = 1; i < lines.length; i++) {
      if (!/^\d+\s*-\s*\d+$/.test(lines[i])) continue;
      if (/^K\s?\d+/i.test(lines[i - 1])) continue;
      var vm = lines[i - 1].match(/^(\S+)\s+/);
      var partner = vm ? (VENDORS[vm[1]] || "") : "";
      var model = lines[i - 1].replace(/^\S+\s+/, "");
      var deco = "";
      var nx = lines[i + 1];
      if (nx && /장식/.test(nx)) { var d = nx.match(/▷\s*([\d.]+)/) || nx.match(/([\d.]+)\s*돈/); deco = d ? d[1] : ""; }
      items.push({ model: model, sg: normSg(lines[i]), deco: deco, partner: partner });
    }
    return { items: items, skipped: 0 };
  }

  function cells(w, it) {
    if (it.simple) return { top: [it.sg, ""], bottom: [it.partner + ".", ""] };
    if (w.karat === "K24") {
      var hasDeco = it.deco !== "";
      var szv = (it.size || "").replace(/^#+/, ""), szTag = szv ? ".#" + szv : "";
      return {
        top: [it.model, it.sg],
        bottom: hasDeco ? [it.partner + ".K24" + szTag, "장식" + it.deco] : [it.partner + ".", "K24" + szTag]
      };
    }
    var sz = (it.size || "").replace(/^#+/, "");
    return { top: [it.model, it.sg], bottom: [it.partner + "." + it.price + w.karat + (sz ? ".#" + sz : ""), it.weight + "g"] };
  }

  function compose(w) {
    var s = state[w.id];
    var sel = s.items.filter(function (it) { return it.checked; });
    if (!sel.length) return "";
    var per = s.perRow, groups = [];
    // 간단 항목은 개수에 포함하지 않고 현재 줄 옆에 붙인다. 일반 항목만 '한 줄에 N개'로 줄을 나눈다.
    var chunks = [], cur = [], normal = 0;
    sel.forEach(function (it) {
      if (!it.simple && normal >= per) { chunks.push(cur); cur = []; normal = 0; }
      cur.push(it);
      if (!it.simple) normal++;
    });
    if (cur.length) chunks.push(cur);
    for (var i = 0; i < chunks.length; i++) {
      var chunk = chunks[i], t = [], b = [];
      chunk.forEach(function (it) {
        var c = cells(w, it);
        var W = Math.max(cw(c.top[0]) + cw(c.top[1]), cw(c.bottom[0]) + cw(c.bottom[1])) + 2;
        t.push(c.top[0] + sp(W - cw(c.top[0]) - cw(c.top[1])) + c.top[1]);
        b.push(c.bottom[0] + sp(W - cw(c.bottom[0]) - cw(c.bottom[1])) + c.bottom[1]);
      });
      groups.push(t.join(GAP).replace(/\s+$/, "") + "\n" + b.join(GAP).replace(/\s+$/, ""));
    }
    return groups.join("\n\n");
  }

  function updatePreview(w) {
    var el = document.getElementById("out-" + w.id);
    var txt = compose(w);
    el.textContent = txt || "체크된 제품이 없습니다.";
    el.dataset.empty = txt ? "" : "1";
  }
  function updateCounts() {
    WINDOWS.forEach(function (w) {
      var c = document.getElementById("cnt-" + w.id);
      if (!c) return;
      c.textContent = state[w.id].items.filter(function (i) { return i.checked; }).length;
    });
  }

  function reparse(w) {
    var s = state[w.id];
    var r = w.karat === "K24" ? parsePure(s.text) : parseGold(s.text, w.karat);
    var old = s.items;
    s.items = r.items.map(function (it, idx) {
      var sw = it.weight, sd = it.deco, sp0 = it.partner || "";
      var prev = old[idx] && old[idx].model === it.model ? old[idx] : null;
      it.checked = prev ? prev.checked : true;
      it.simple = prev ? prev.simple : false;
      it.partner = prev && prev.partner !== prev.srcPartner ? prev.partner : sp0;
      it.srcPartner = sp0;
      var spr = it.price || "";
      it.price = prev && prev.price !== prev.srcPrice ? prev.price : spr;
      it.srcPrice = spr;
      it.size = prev ? prev.size || "" : "";
      if (prev) {
        if (prev.weight !== undefined && prev.weight !== prev.srcWeight) it.weight = prev.weight;
        if (prev.deco !== undefined && prev.deco !== prev.srcDeco) it.deco = prev.deco;
      }
      it.srcWeight = sw; it.srcDeco = sd;
      it.srcSg = it.sg;
      applyWeight(it);
      return it;
    });
    s.skipped = r.skipped;
    renderItems(w);
    updatePreview(w); updateCounts();
  }

  function renderItems(w) {
    var s = state[w.id], box = document.getElementById("items-" + w.id);
    var note = document.getElementById("note-" + w.id);
    note.textContent = s.skipped ? "다른 함량 " + s.skipped + "건은 이 창에서 제외했습니다." : "";
    if (!s.items.length) {
      box.innerHTML = '<div class="empty">' + (w.karat === "K24"
        ? "아직 인식된 제품이 없습니다. 거래처 모델명 줄 다음에 수공-중량 줄이 오도록 붙여넣으세요."
        : "아직 인식된 제품이 없습니다. 모델명, 함량 중량g, 수공-중량 순서로 붙여넣으세요.") + "</div>";
      return;
    }
    box.innerHTML = s.items.map(function (it, i) {
      var fields = w.karat === "K24"
        ? '<label>거래처<input data-f="partner" data-i="' + i + '" value="' + esc(it.partner) + '" autocomplete="off"></label>' +
          '<label>장식중량 (비우면 없음)<input data-f="deco" data-i="' + i + '" value="' + esc(it.deco) + '" inputmode="decimal" autocomplete="off"></label>' +
          '<label>size<input data-f="size" data-i="' + i + '" value="' + esc(it.size || "") + '" autocomplete="off"></label>'
        : '<label>거래처<input data-f="partner" data-i="' + i + '" value="' + esc(it.partner) + '" autocomplete="off"></label>' +
          '<label>입고가<input data-f="price" data-i="' + i + '" value="' + esc(it.price) + '" inputmode="decimal" autocomplete="off"></label>' +
          '<label>중량 g<input data-f="weight" data-i="' + i + '" value="' + esc(it.weight) + '" inputmode="decimal" autocomplete="off"></label>' +
          '<label>size/color<input data-f="size" data-i="' + i + '" value="' + esc(it.size || "") + '" autocomplete="off"></label>';
      var meta = w.karat === "K24" ? it.sg : w.karat + " " + it.weight + "g · " + it.sg;
      return '<div class="item' + (it.checked ? "" : " off") + '" id="item-' + w.id + '-' + i + '">' +
        '<div class="checks"><input type="checkbox" data-c="' + i + '" ' + (it.checked ? "checked" : "") + ' aria-label="' + esc(it.model) + ' 포함"></div>' +
        '<label class="simple"><input type="checkbox" data-s="' + i + '" ' + (it.simple ? "checked" : "") + '>간단</label>' +
        '<div class="head"><span class="model">' + esc(it.model) + '</span><span class="meta">' + esc(meta) + '</span></div>' +
        '<div class="fields">' + fields + '</div></div>';
    }).join("");
  }

  function build() {
    var tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
    WINDOWS.forEach(function (w) { state[w.id] = { text: SAMPLES[w.id], items: [], skipped: 0, perRow: Infinity }; });
    WINDOWS.forEach(function (w, idx) {
      var b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + w.id;
      b.setAttribute("aria-selected", idx === 1 ? "true" : "false");
      b.innerHTML = esc(w.label) + ' <span class="n" id="cnt-' + w.id + '">0</span>';
      b.addEventListener("click", function () { select(w.id); });
      tabs.appendChild(b);

      var p = document.createElement("section");
      p.className = "panel"; p.id = "panel-" + w.id; p.setAttribute("role", "tabpanel"); p.hidden = idx !== 1;
      p.innerHTML =
        '<div class="box">' +
          '<h2>제품사양표기 <span class="hint">' + (w.karat === "K24" ? "거래처 모델명 / 수공-중량 / [K18 장식별도▷0.12돈]" : "모델명 / 함량 중량g / 수공-중량") + '</span></h2>' +
          '<textarea class="src" id="src-' + w.id + '" spellcheck="false">' + esc(SAMPLES[w.id]) + '</textarea>' +
          '<div class="row-tools"><button class="btn" type="button" data-clear="' + w.id + '">지우기</button><span class="note" id="note-' + w.id + '"></span></div>' +
        '</div>' +
        '<div class="box">' +
          '<h2>미리보기</h2>' +
          '<div class="row-tools"><label class="opt">한 줄에 <select id="per-' + w.id + '"><option value="0" selected>전체</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select> 개</label></div>' +
          '<pre class="out" id="out-' + w.id + '"></pre>' +
          '<div class="row-tools"><button class="btn primary" type="button" id="copy-' + w.id + '">복사하기</button></div>' +
        '</div>' +
        '<div class="box">' +
          '<h2>제품 <span class="hint">체크한 것만 미리보기에 나옵니다</span></h2>' +
          '<div class="row-tools"><label class="opt"><input type="checkbox" id="all-' + w.id + '" checked> 전체 선택</label></div>' +
          '<div class="items" id="items-' + w.id + '"></div>' +
        '</div>';
      panels.appendChild(p);

      var src = p.querySelector("#src-" + w.id);
      src.addEventListener("input", function () { state[w.id].text = src.value; reparse(w); });
      p.querySelector('[data-clear]').addEventListener("click", function () { src.value = ""; state[w.id].text = ""; reparse(w); src.focus(); });
      p.querySelector("#per-" + w.id).addEventListener("change", function (e) { state[w.id].perRow = +e.target.value || Infinity; updatePreview(w); });
      p.querySelector("#all-" + w.id).addEventListener("change", function (e) {
        state[w.id].items.forEach(function (it) { it.checked = e.target.checked; });
        renderItems(w); updatePreview(w); updateCounts();
      });
      var items = p.querySelector("#items-" + w.id);
      items.addEventListener("input", function (e) {
        var t = e.target; if (!t.dataset.f) return;
        var cur = state[w.id].items[+t.dataset.i];
        cur[t.dataset.f] = t.value.trim();
        if (t.dataset.f === "weight") {
          applyWeight(cur);
          var mt = document.querySelector("#item-" + w.id + "-" + t.dataset.i + " .meta");
          if (mt) mt.textContent = w.karat + " " + cur.weight + "g · " + cur.sg;
        }
        updatePreview(w);
      });
      items.addEventListener("change", function (e) {
        var t = e.target;
        if (t.dataset.s !== undefined) { state[w.id].items[+t.dataset.s].simple = t.checked; updatePreview(w); return; }
        if (t.dataset.c === undefined) return;
        var i = +t.dataset.c, it = state[w.id].items[i];
        it.checked = t.checked;
        document.getElementById("item-" + w.id + "-" + i).classList.toggle("off", !it.checked);
        updatePreview(w); updateCounts();
        var all = state[w.id].items.every(function (x) { return x.checked; });
        document.getElementById("all-" + w.id).checked = all;
      });
      var copyBtn = p.querySelector("#copy-" + w.id);
      copyBtn.addEventListener("click", function () { copy(w, copyBtn); });
      reparse(w);
    });
  }

  function select(id) {
    WINDOWS.forEach(function (w) {
      var on = w.id === id;
      document.getElementById("panel-" + w.id).hidden = !on;
      document.getElementById("tab-" + w.id).setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function flash(btn, msg) {
    var old = btn.textContent;
    btn.textContent = msg; btn.classList.add("ok");
    setTimeout(function () { btn.textContent = "복사하기"; btn.classList.remove("ok"); }, 1400);
  }
  // 복사: 일반 텍스트 + 고정폭(모노스페이스) 서식 HTML을 함께 담아, 붙여넣는 곳에서도 열이 맞게 한다.
  var MONO = "'Nanum Gothic Coding','D2Coding','Consolas','Courier New',monospace";
  function copy(w, btn) {
    var txt = compose(w);
    if (!txt) { flash(btn, "복사할 내용이 없습니다"); return; }
    var html = '<pre style="font-family:' + MONO + ';white-space:pre;margin:0">' + esc(txt) + '</pre>';
    function rich() {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre;font-family:" + MONO;
      d.textContent = txt;
      document.body.appendChild(d);
      var r = document.createRange(); r.selectNodeContents(d);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      sel.removeAllRanges(); document.body.removeChild(d);
      if (ok) { flash(btn, "복사됨"); return; }
      var r2 = document.createRange(); r2.selectNodeContents(document.getElementById("out-" + w.id));
      sel.removeAllRanges(); sel.addRange(r2);
      flash(btn, "선택됨 · Ctrl/⌘+C");
    }
    if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
      try {
        var item = new ClipboardItem({
          "text/plain": new Blob([txt], { type: "text/plain" }),
          "text/html": new Blob([html], { type: "text/html" })
        });
        navigator.clipboard.write([item]).then(function () { flash(btn, "복사됨"); }, rich);
        return;
      } catch (e) {}
    }
    rich();
  }

  var root = document.documentElement, themeBtn = document.getElementById("themeBtn");
  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function syncBtn() { themeBtn.textContent = isDark() ? "라이트모드" : "다크모드"; }
  try { var saved = localStorage.getItem("order-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("order-theme", next); } catch (e) {}
    syncBtn();
  });
  syncBtn();

  build();
})();
</script>

</body></html>
