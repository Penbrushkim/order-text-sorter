<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>주문 텍스트 정렬기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 3 tabs (K14 / K18 / K24). Each = paste box + item list (left), live preview + copy (right). */
:root {
  /* UI colors from the Chilbo logo: brown #54473F, beige #EFE9E2, gold #B08D57 */
  --bg: #efe9e2;
  --surface: #faf7f3;
  --ink: #3a312b;
  --muted: #7d6f64;
  --line: #d8cec3;
  --accent: #54473f;
  --accent-ink: #faf7f3;
  --accent-soft: #e2d9cf;
  --ok: #b08d57;
  --preview-bg: #fffdf9;
  --font-ui: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --font-mono: "Nanum Gothic Coding", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1b18; --surface: #2a2521; --ink: #efe9e2; --muted: #a89a8d; --line: #40372f;
    --accent: #c8a56e; --accent-ink: #1f1b18; --accent-soft: #3a3027; --ok: #c8a56e; --preview-bg: #231f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1b18; --surface: #2a2521; --ink: #efe9e2; --muted: #a89a8d; --line: #40372f;
  --accent: #c8a56e; --accent-ink: #1f1b18; --accent-soft: #3a3027; --ok: #c8a56e; --preview-bg: #231f1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  font: inherit; font-weight: 500; font-size: 15px; padding: 9px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab .n { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .n { background: rgba(255,255,255,.22); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box h2 { font-size: 14px; margin: 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
textarea.src {
  width: 100%; min-height: 150px; resize: vertical; font-family: var(--font-mono); font-size: 14px; line-height: 1.5;
  padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.btn {
  font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 15px; padding: 10px 18px; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.top > div:first-child { min-width: 0; }
.top-r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.ver { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.item.off { opacity: .55; }
.item input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.checks { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.item { position: relative; }
.item .head { padding-right: 64px; }
.simple { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; font-size: 13px; color: var(--muted); gap: 5px; cursor: pointer; }
.simple input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.item .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
.model { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.fields { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; }
.fields label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); flex: 1 1 90px; min-width: 0; }
.fields input {
  font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
}
.empty { color: var(--muted); font-size: 13px; padding: 14px 4px; }
pre.out {
  margin: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.55; white-space: pre; overflow-x: auto;
  background: var(--preview-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-height: 90px;
  tab-size: 1;
}
.opt { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.opt select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.spacer { flex: 1; }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>주문 텍스트 정렬기</h1>
      <p class="sub">붙여넣은 주문 내용을 전표 형식으로 바꿉니다. 함량별로 창이 나뉘어 있습니다.</p>
    </div>
    <div class="top-r">
      <button class="btn" type="button" id="themeBtn">다크모드</button>
      <span class="ver">V1.3</span>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
(function () {
  var SAMPLES = { K14: "", K18: "", K24: "" };
  var WINDOWS = [
    { id: "K24", label: "K24 (순금)", karat: "K24" },
    { id: "K18", label: "K18", karat: "K18" },
    { id: "K14", label: "K14", karat: "K14" }
  ];
  var VENDORS = { "크라이스": "A67", "레이나": "A45", "예랑": "YR" };
  var GAP = "   ";
  var state = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function cw(s) { var w = 0; for (var i = 0; i < s.length; i++) { w += s.charCodeAt(i) > 0x2e7f ? 2 : 1; } return w; }
  function sp(n) { return n > 0 ? new Array(n + 1).join(" ") : ""; }
  function normSg(s) { return s.replace(/\s*-\s*/, "-"); }

  function parseGold(text, karat) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var items = [], skipped = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^K\s?(14|18|24)\s*([\d.]+)\s*g?$/i);
      if (!m || i === 0) continue;
      if ("K" + m[1] !== karat) { skipped++; continue; }
      var sg = lines[i + 1] && /^\d+\s*-\s*\d+$/.test(lines[i + 1]) ? normSg(lines[i + 1]) : "";
      items.push({ model: lines[i - 1], sg: sg, weight: m[2] });
    }
    return { items: items, skipped: skipped };
  }

  function parsePure(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var items = [];
    for (var i = 1; i < lines.length; i++) {
      if (!/^\d+\s*-\s*\d+$/.test(lines[i])) continue;
      if (/^K\s?\d+/i.test(lines[i - 1])) continue;
      var vm = lines[i - 1].match(/^(\S+)\s+/);
      var partner = vm ? (VENDORS[vm[1]] || "") : "";
      var model = lines[i - 1].replace(/^\S+\s+/, "");
      var deco = "";
      var nx = lines[i + 1];
      if (nx && /장식/.test(nx)) { var d = nx.match(/▷\s*([\d.]+)/) || nx.match(/([\d.]+)\s*돈/); deco = d ? d[1] : ""; }
      items.push({ model: model, sg: normSg(lines[i]), deco: deco, partner: partner });
    }
    return { items: items, skipped: 0 };
  }

  function cells(w, it) {
    if (it.simple) return { top: [it.sg, ""], bottom: [it.partner + ".", ""] };
    if (w.karat === "K24") {
      var hasDeco = it.deco !== "";
      return {
        top: [it.model, it.sg],
        bottom: hasDeco ? [it.partner + ".K24", "장식" + it.deco] : [it.partner + ".", "K24"]
      };
    }
    return { top: [it.model, it.sg], bottom: [it.partner + "." + it.price + w.karat, it.weight + "g"] };
  }

  function compose(w) {
    var s = state[w.id];
    var sel = s.items.filter(function (it) { return it.checked; });
    if (!sel.length) return "";
    var per = s.perRow, groups = [];
    // 간단 항목은 개수에 포함하지 않고 현재 줄 옆에 붙인다. 일반 항목만 '한 줄에 N개'로 줄을 나눈다.
    var chunks = [], cur = [], normal = 0;
    sel.forEach(function (it) {
      if (!it.simple && normal >= per) { chunks.push(cur); cur = []; normal = 0; }
      cur.push(it);
      if (!it.simple) normal++;
    });
    if (cur.length) chunks.push(cur);
    for (var i = 0; i < chunks.length; i++) {
      var chunk = chunks[i], t = [], b = [];
      chunk.forEach(function (it) {
        var c = cells(w, it);
        var W = Math.max(cw(c.top[0]) + cw(c.top[1]), cw(c.bottom[0]) + cw(c.bottom[1])) + 2;
        t.push(c.top[0] + sp(W - cw(c.top[0]) - cw(c.top[1])) + c.top[1]);
        b.push(c.bottom[0] + sp(W - cw(c.bottom[0]) - cw(c.bottom[1])) + c.bottom[1]);
      });
      groups.push(t.join(GAP).replace(/\s+$/, "") + "\n" + b.join(GAP).replace(/\s+$/, ""));
    }
    return groups.join("\n\n");
  }

  function updatePreview(w) {
    var el = document.getElementById("out-" + w.id);
    var txt = compose(w);
    el.textContent = txt || "체크된 제품이 없습니다.";
    el.dataset.empty = txt ? "" : "1";
  }
  function updateCounts() {
    WINDOWS.forEach(function (w) {
      var c = document.getElementById("cnt-" + w.id);
      if (!c) return;
      c.textContent = state[w.id].items.filter(function (i) { return i.checked; }).length;
    });
  }

  function reparse(w) {
    var s = state[w.id];
    var r = w.karat === "K24" ? parsePure(s.text) : parseGold(s.text, w.karat);
    var old = s.items;
    s.items = r.items.map(function (it, idx) {
      var sw = it.weight, sd = it.deco, sp0 = it.partner || "";
      var prev = old[idx] && old[idx].model === it.model ? old[idx] : null;
      it.checked = prev ? prev.checked : true;
      it.simple = prev ? prev.simple : false;
      it.partner = prev && prev.partner !== prev.srcPartner ? prev.partner : sp0;
      it.srcPartner = sp0;
      it.price = prev ? prev.price : "";
      if (prev) {
        if (prev.weight !== undefined && prev.weight !== prev.srcWeight) it.weight = prev.weight;
        if (prev.deco !== undefined && prev.deco !== prev.srcDeco) it.deco = prev.deco;
      }
      it.srcWeight = sw; it.srcDeco = sd;
      return it;
    });
    s.skipped = r.skipped;
    renderItems(w);
    updatePreview(w); updateCounts();
  }

  function renderItems(w) {
    var s = state[w.id], box = document.getElementById("items-" + w.id);
    var note = document.getElementById("note-" + w.id);
    note.textContent = s.skipped ? "다른 함량 " + s.skipped + "건은 이 창에서 제외했습니다." : "";
    if (!s.items.length) {
      box.innerHTML = '<div class="empty">' + (w.karat === "K24"
        ? "아직 인식된 제품이 없습니다. 거래처 모델명 줄 다음에 수공-중량 줄이 오도록 붙여넣으세요."
        : "아직 인식된 제품이 없습니다. 모델명, 함량 중량g, 수공-중량 순서로 붙여넣으세요.") + "</div>";
      return;
    }
    box.innerHTML = s.items.map(function (it, i) {
      var fields = w.karat === "K24"
        ? '<label>거래처<input data-f="partner" data-i="' + i + '" value="' + esc(it.partner) + '" autocomplete="off"></label>' +
          '<label>장식중량 (비우면 없음)<input data-f="deco" data-i="' + i + '" value="' + esc(it.deco) + '" inputmode="decimal" autocomplete="off"></label>'
        : '<label>거래처<input data-f="partner" data-i="' + i + '" value="' + esc(it.partner) + '" autocomplete="off"></label>' +
          '<label>입고가<input data-f="price" data-i="' + i + '" value="' + esc(it.price) + '" inputmode="decimal" autocomplete="off"></label>' +
          '<label>중량 g<input data-f="weight" data-i="' + i + '" value="' + esc(it.weight) + '" inputmode="decimal" autocomplete="off"></label>';
      var meta = w.karat === "K24" ? it.sg : w.karat + " " + it.weight + "g · " + it.sg;
      return '<div class="item' + (it.checked ? "" : " off") + '" id="item-' + w.id + '-' + i + '">' +
        '<div class="checks"><input type="checkbox" data-c="' + i + '" ' + (it.checked ? "checked" : "") + ' aria-label="' + esc(it.model) + ' 포함"></div>' +
        '<label class="simple"><input type="checkbox" data-s="' + i + '" ' + (it.simple ? "checked" : "") + '>간단</label>' +
        '<div class="head"><span class="model">' + esc(it.model) + '</span><span class="meta">' + esc(meta) + '</span></div>' +
        '<div class="fields">' + fields + '</div></div>';
    }).join("");
  }

  function build() {
    var tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
    WINDOWS.forEach(function (w) { state[w.id] = { text: SAMPLES[w.id], items: [], skipped: 0, perRow: 3 }; });
    WINDOWS.forEach(function (w, idx) {
      var b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + w.id;
      b.setAttribute("aria-selected", idx === 1 ? "true" : "false");
      b.innerHTML = esc(w.label) + ' <span class="n" id="cnt-' + w.id + '">0</span>';
      b.addEventListener("click", function () { select(w.id); });
      tabs.appendChild(b);

      var p = document.createElement("section");
      p.className = "panel"; p.id = "panel-" + w.id; p.setAttribute("role", "tabpanel"); p.hidden = idx !== 1;
      p.innerHTML =
        '<div class="box">' +
          '<h2>제품사양표기 <span class="hint">' + (w.karat === "K24" ? "거래처 모델명 / 수공-중량 / [K18 장식별도▷0.12돈]" : "모델명 / 함량 중량g / 수공-중량") + '</span></h2>' +
          '<textarea class="src" id="src-' + w.id + '" spellcheck="false">' + esc(SAMPLES[w.id]) + '</textarea>' +
          '<div class="row-tools"><button class="btn" type="button" data-clear="' + w.id + '">지우기</button><span class="note" id="note-' + w.id + '"></span></div>' +
        '</div>' +
        '<div class="box">' +
          '<h2>미리보기</h2>' +
          '<div class="row-tools"><label class="opt">한 줄에 <select id="per-' + w.id + '"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select> 개</label></div>' +
          '<pre class="out" id="out-' + w.id + '"></pre>' +
          '<div class="row-tools"><button class="btn primary" type="button" id="copy-' + w.id + '">복사하기</button></div>' +
        '</div>' +
        '<div class="box">' +
          '<h2>제품 <span class="hint">체크한 것만 미리보기에 나옵니다</span></h2>' +
          '<div class="row-tools"><label class="opt"><input type="checkbox" id="all-' + w.id + '" checked> 전체 선택</label></div>' +
          '<div class="items" id="items-' + w.id + '"></div>' +
        '</div>';
      panels.appendChild(p);

      var src = p.querySelector("#src-" + w.id);
      src.addEventListener("input", function () { state[w.id].text = src.value; reparse(w); });
      p.querySelector('[data-clear]').addEventListener("click", function () { src.value = ""; state[w.id].text = ""; reparse(w); src.focus(); });
      p.querySelector("#per-" + w.id).addEventListener("change", function (e) { state[w.id].perRow = +e.target.value; updatePreview(w); });
      p.querySelector("#all-" + w.id).addEventListener("change", function (e) {
        state[w.id].items.forEach(function (it) { it.checked = e.target.checked; });
        renderItems(w); updatePreview(w); updateCounts();
      });
      var items = p.querySelector("#items-" + w.id);
      items.addEventListener("input", function (e) {
        var t = e.target; if (!t.dataset.f) return;
        state[w.id].items[+t.dataset.i][t.dataset.f] = t.value.trim();
        updatePreview(w);
      });
      items.addEventListener("change", function (e) {
        var t = e.target;
        if (t.dataset.s !== undefined) { state[w.id].items[+t.dataset.s].simple = t.checked; updatePreview(w); return; }
        if (t.dataset.c === undefined) return;
        var i = +t.dataset.c, it = state[w.id].items[i];
        it.checked = t.checked;
        document.getElementById("item-" + w.id + "-" + i).classList.toggle("off", !it.checked);
        updatePreview(w); updateCounts();
        var all = state[w.id].items.every(function (x) { return x.checked; });
        document.getElementById("all-" + w.id).checked = all;
      });
      var copyBtn = p.querySelector("#copy-" + w.id);
      copyBtn.addEventListener("click", function () { copy(w, copyBtn); });
      reparse(w);
    });
  }

  function select(id) {
    WINDOWS.forEach(function (w) {
      var on = w.id === id;
      document.getElementById("panel-" + w.id).hidden = !on;
      document.getElementById("tab-" + w.id).setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function flash(btn, msg) {
    var old = btn.textContent;
    btn.textContent = msg; btn.classList.add("ok");
    setTimeout(function () { btn.textContent = "복사하기"; btn.classList.remove("ok"); }, 1400);
  }
  function copy(w, btn) {
    var txt = compose(w);
    if (!txt) { flash(btn, "복사할 내용이 없습니다"); return; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) { flash(btn, "복사됨"); }
      else {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("out-" + w.id));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        flash(btn, "선택됨 · Ctrl/⌘+C");
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { flash(btn, "복사됨"); }, fallback);
    } else { fallback(); }
  }

  var root = document.documentElement, themeBtn = document.getElementById("themeBtn");
  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function syncBtn() { themeBtn.textContent = isDark() ? "라이트모드" : "다크모드"; }
  try { var saved = localStorage.getItem("order-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("order-theme", next); } catch (e) {}
    syncBtn();
  });
  syncBtn();

  build();
})();
</script>
